name: aquasense
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.1.3
      - pandas==2.2.3
      - scipy==1.16.3
      - scikit-learn==1.6.1
      - xgboost==3.4.1
      - tensorflow==2.21.0
      - shap==0.52.0
      - matplotlib==3.10.0
      - seaborn==0.13.2
      - tqdm==4.67.3
      - joblib==1.6.0

# Random seed: 42 (all models); seeds 0-4 for repeated runs
# Acquisition hardware: Raspberry Pi 5, ADS1115, TDS DAR-02-W40, Bosch BME680
# Benchmark run on: Google Colab (GPU Tesla T4), Linux-6.6.122+-x86_64-with-glibc2.39
